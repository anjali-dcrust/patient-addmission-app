server.port=${PORT:8080}
# Local default: file-based H2 (persists across restarts). In production set SPRING_DATASOURCE_* env vars (PostgreSQL).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/patients}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
